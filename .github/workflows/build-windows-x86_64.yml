name: build-windows-x86_64

on:
  workflow_dispatch:
    inputs:
      xl_converter_ref:
        description: 'XL Converter ref (branch or tag)'
        default: 'unstable-win-ci-patches'
        required: true
        type: string
      force_clean:
        description: 'Force clean'
        default: false
        type: boolean
    
      # Debug
      build_libjxl:
        description: 'Build libjxl'
        default: false
        type: boolean
      build_libavif:
        description: 'Build libavif'
        default: false
        type: boolean
      build_libjpeg_turbo:
        description: 'Build libjpeg-turbo'
        default: false
        type: boolean
      build_oxipng:
        description: 'Build oxipng'
        default: false
        type: boolean
      build_exiftool:
        description: 'Build exiftool'
        default: false
        type: boolean
      build_imagemagick:
        description: 'Build imagemagick'
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  build-windows-x86_64:
    runs-on: windows-2022
    
    steps:
      - name: Config git
        run: git config --global core.autocrlf false

      - name: Checkout the source code
        uses: actions/checkout@v6
        with:
          repository: JacobDev1/xl-converter
          ref: ${{ inputs.xl_converter_ref }}
          path: xl-converter

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install bundling tools
        run: choco install innosetup --yes

      - name: Purge cache
        if: ${{ inputs.force_clean }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh cache delete windows-xl-converter-deps --repo ${{ github.repository }} || true

      - name: Restore cached deps
        id: cache-deps
        if: ${{ !inputs.force_clean }}
        uses: actions/cache/restore@v4
        with:
          path: xl-converter/bin
          key: windows-xl-converter-deps

      - name: Setup MSYS2
        if: ${{ steps.cache-deps.outputs.cache-hit != 'true' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            cmake
            wget
            make
            base-devel
            autoconf
            automake
            libtool
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-giflib
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-7zip
            mingw-w64-x86_64-imagemagick
            mingw-w64-x86_64-libjxl
            mingw-w64-x86_64-aom

      # - name: Build deps
      #   if: ${{ steps.cache-deps.outputs.cache-hit != 'true' }}
      #   shell: msys2 {0}
      #   run: cd xl-converter && make deps

      - name: Build libjxl dependency
        if: ${{ inputs.build_libjxl }}
        shell: msys2 {0}
        run: cd xl-converter && make libjxl

      - name: Build libjpeg-turbo dependency
        if: ${{ inputs.build_libjpeg_turbo }}
        shell: msys2 {0}
        run: cd xl-converter && make libjpeg-turbo

      - name: Build Oxipng dependency
        if: ${{ inputs.build_oxipng }}
        shell: msys2 {0}
        run: cd xl-converter && make oxipng

      - name: Build ExifTool dependency
        if: ${{ inputs.build_exiftool }}
        shell: msys2 {0}
        run: cd xl-converter && make exiftool

      - name: Build libavif dependency
        if: ${{ inputs.build_libavif }}
        shell: msys2 {0}
        run: cd xl-converter && make libavif

      - name: Build ImageMagick dependency
        if: ${{ inputs.build_imagemagick }}
        shell: msys2 {0}
        run: cd xl-converter && make imagemagick

      - name: Save deps to cache
        if: ${{ steps.cache-deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: xl-converter/bin
          key: windows-xl-converter-deps

      - name: Build application
        shell: cmd
        run: |
          set MSYSTEM=
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd xl-converter
          python misc/build_scripts/windows/build.py ^
            --python-path "%pythonLocation%\python.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-builds
          path: xl-converter/dist/
