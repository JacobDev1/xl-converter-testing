name: build-macos-universal2

on:
  workflow_dispatch:
    inputs:
      xl_converter_ref:
        description: 'XL Converter ref (branch or tag)'
        default: 'unstable'
        required: true
        type: string
      force_clean:
        description: 'Force clean'
        default: false
        type: boolean

      # Temp inputs for debugging
      install_python:
        description: 'Install Python'
        default: true
        type: boolean
      install_rust:
        description: 'Install Rust'
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  build-macos-universal2:
    runs-on: macos-15

    steps:
      - name: Purge cache
        if: ${{ inputs.force_clean }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh cache delete macports-macos-universal2 || true

      - name: Prepare MacPorts cache dir
        run: |
          sudo mkdir -p /opt/local
          sudo chown -R $USER:admin /opt/local

      - name: Cache MacPorts packages
        id: cache-macports
        if: ${{ !inputs.force_clean }}
        uses: actions/cache/restore@v4
        with:
          path: /opt/local
          key: macports-macos-universal2

      - name: Set MacPorts permissions
        if: ${{ steps.cache-macports.outputs.cache-hit == 'true' }}
        run: sudo chown -R root:admin /opt/local

      - name: Install MacPorts
        if: ${{ steps.cache-macports.outputs.cache-hit != 'true' }}
        run: |
          set -euox pipefail
          curl -L https://github.com/macports/macports-base/releases/download/v2.11.6/MacPorts-2.11.6-15-Sequoia.pkg -o MacPorts.pkg
          sudo installer -pkg MacPorts.pkg -target /
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"
          sudo /opt/local/bin/port -v selfupdate

      - name: Restore MacPorts
        if: ${{ steps.cache-macports.outputs.cache-hit == 'true' }}
        run: |
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"

      - name: Install build tools
        if: ${{ steps.cache-macports.outputs.cache-hit != 'true' }}
        run: sudo port -N install nasm cmake git wget gtest coreutils ninja gmake gsed llvm-17 clang-17 librsvg yasm

      - name: Install packages from source
        id: install-packages
        if: ${{ steps.cache-macports.outputs.cache-hit != 'true' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          # Setting this will force a recompile which is why I set this after installing heavy packages.
          printf "build_arch    arm64\nmacosx_deployment_target    11.0\n" | sudo tee -a /opt/local/etc/macports/macports.conf > /dev/null
          sudo port -N -s install pkgconfig +universal giflib5 +universal libjpeg-turbo +universal libpng +universal zlib +universal brotli +universal webp +universal libiconv +universal libomp +universal imath +universal glib2 +universal gettext +universal openjpeg +universal lcms2 +universal fontconfig +universal freetype +universal libjxl +universal liblqr +universal tiff +universal libtool +universal

      - name: Prepare MacPorts for caching
        if: ${{ steps.cache-macports.outputs.cache-hit != 'true' }}
        run: |
          sudo rm -rf /opt/local/var/macports/home
          sudo chown -R $USER /opt/local

      - name: Save MacPorts cache
        id: cache-macports-save
        uses: actions/cache/save@v4
        if: ${{ always() && steps.cache-macports.outputs.cache-hit != 'true' && steps.install-packages.outcome == 'success' }}
        with:
          path: /opt/local
          key: macports-macos-universal2

      - name: Setup Python
        if: ${{ inputs.install_python }}
        run: |
          set -euox pipefail
          curl -L "https://www.python.org/ftp/python/3.13.10/python-3.13.10-macos11.pkg" -o python.pkg
          sudo installer -pkg python.pkg -target /
          sudo ln -sf /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 /usr/local/bin/python
          sudo ln -sf /Library/Frameworks/Python.framework/Versions/3.13/bin/pip3 /usr/local/bin/pip

      - name: Setup Rust
        if: ${{ inputs.install_rust }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source $HOME/.cargo/env
          rustup target add x86_64-apple-darwin

      - name: Checkout the source code
        uses: actions/checkout@v6
        with:
          repository: JacobDev1/xl-converter
          ref: ${{ inputs.xl_converter_ref }}
          path: xl-converter

      # Caching is done per dependency due to build complexity.

      - name: Cache libjxl dependency
        uses: actions/cache@v4
        id: cache-libjxl
        with:
          path: |
            xl-converter/bin/macos/cjxl
            xl-converter/bin/macos/djxl
            xl-converter/bin/macos/jxlinfo
            xl-converter/bin/macos/cjpegli
          key: macos-libjxl${{ hashFiles('xl-converter/misc/build_scripts/macos/libjxl.sh') }}

      - name: Build libjxl dependency
        if: ${{ steps.cache-libjxl.outputs.cache-hit != 'true' }}
        run: cd xl-converter && make libjxl

      - name: Cache libjpeg-turbo dependency
        uses: actions/cache@v4
        id: cache-libjpeg-turbo
        with:
          path: xl-converter/bin/macos/jpegtran
          key: macos-libjpeg-turbo-${{ hashFiles('xl-converter/misc/build_scripts/macos/libjpeg-turbo.sh') }}

      - name: Build libjpeg-turbo dependency
        if: ${{ steps.cache-libjpeg-turbo.outputs.cache-hit != 'true' }}
        run: cd xl-converter && make libjpeg-turbo

      - name: Cache Oxipng dependency
        uses: actions/cache@v4
        id: cache-oxipng
        with:
          path: xl-converter/bin/macos/oxipng
          key: macos-oxipng-${{ hashFiles('xl-converter/misc/build_scripts/macos/oxipng.sh') }}

      - name: Build Oxipng dependency
        if: ${{ steps.cache-oxipng.outputs.cache-hit != 'true' }}
        run: cd xl-converter && make oxipng

      - name: Cache ExifTool dependency
        uses: actions/cache@v4
        id: cache-exiftool
        with:
          path: xl-converter/bin/macos/exiftool
          key: macos-exiftool-${{ hashFiles('xl-converter/misc/build_scripts/macos/exiftool.sh') }}

      - name: Build ExifTool dependency
        if: ${{ steps.cache-exiftool.outputs.cache-hit != 'true' }}
        run: cd xl-converter && make exiftool
      
      - name: Cache libavif dependency
        uses: actions/cache@v4
        id: cache-libavif
        with:
          path: |
            xl-converter/bin/macos/avifenc
            xl-converter/bin/macos/avifdec
          key: macos-libavif-${{ hashFiles('xl-converter/misc/build_scripts/macos/libavif.sh') }}

      - name: Build libavif dependency
        if: ${{ steps.cache-libavif.outputs.cache-hit != 'true' }}
        run: cd xl-converter && make libavif

      - name: Cache ImageMagick dependency
        uses: actions/cache@v4
        id: cache-imagemagick
        with:
          path: xl-converter/bin/macos/imagemagick
          key: macos-imagemagick-${{ hashFiles('xl-converter/misc/build_scripts/macos/imagemagick.sh') }}

      - name: Build ImageMagick dependency
        if: ${{ steps.cache-imagemagick.outputs.cache-hit != 'true' }}
        run: cd xl-converter && make imagemagick

      - name: Setup Python environment
        run: |
          cd xl-converter

          # Build
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export ARCHFLAGS="-arch x86_64 -arch arm64"
          export CFLAGS="-arch x86_64 -arch arm64"
          export LDFLAGS="-arch x86_64 -arch arm64"
          export PIP_NO_BINARY=psutil

          python -m venv env_build
          source env_build/bin/activate
          pip install -r requirements.txt --no-binary=:psutil:

          # Compile the bootloader
          export CC="/opt/local/bin/clang-mp-17"
          unset ARCHFLAGS CFLAGS LDFLAGS
          git clone -b v6.11.1 --depth 1 https://github.com/pyinstaller/pyinstaller.git misc/pyinstaller
          cd misc/pyinstaller/bootloader
          python waf all --universal2 --clang
          cd ..
          pip install .
          cd ../..

          # Test
          python -m venv env_dev
          source env_dev/bin/activate
          pip install -r requirements.txt -r requirements_test.txt

      - name: Run tests
        run: |
          cd xl-converter
          source env_dev/bin/activate
          python test.py
          python test_convert.py

      - name: Build
        run: |
          cd xl-converter
          source env_build/bin/activate
          python build.py -b dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal2-build
          path: xl-converter/dist/*.dmg
