name: build-linux-x86_64

on:
  workflow_dispatch:
    inputs:
      xl_converter_ref:
        description: 'XL Converter ref (branch or tag)'
        default: 'unstable'
        required: true
        type: string

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v6
        with:
          repository: JacobDev1/xl-converter
          ref: ${{ inputs.xl_converter_ref }}
          path: xl-converter

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: xl-converter/bin
          key: linux-xl-converter-deps-${{ hashFiles('xl-converter/misc/build_scripts/linux/*') }}

      - name: Build deps
        if: ${{ steps.cache-deps.outputs.cache-hit != 'true' }}
        run: cd xl-converter && make deps

      - name: Build application
        run: cd xl-converter && make build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-builds
          path: xl-converter/dist/

